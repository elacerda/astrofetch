[package]
name = "astrofetch"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "A screenFetch-inspired terminal app with procedural astrophysical ASCII art"
license = "MIT"
repository = "https://github.com/elacerda/astrofetch"
homepage = "https://github.com/elacerda/astrofetch"
readme = "README.md"
keywords = ["cli", "terminal", "fetch", "ascii-art"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
sysinfo = "0.38"
unicode-width = "0.2"
is-terminal = "0.4"
crossterm = "0.29"
noise = "0.9"
update-informer = { version = "1.3", default-features = false, features = ["github", "ureq", "rustls-tls"] }
semver = "1.0"

[dev-dependencies]
