name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-version:
    name: Verify tag matches Cargo version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare tag and Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml | sed -n '1p')"
          echo "release tag: ${GITHUB_REF_NAME} (version: ${tag})"
          echo "cargo version: ${cargo_version}"
          if [ -z "$cargo_version" ]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "Tag and Cargo version match: ${tag}"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify-version

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package="astrofetch-${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/astrofetch" "dist/${package}/astrofetch"
          tar -czf "dist/${package}.tar.gz" -C "dist/${package}" astrofetch

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $package = "astrofetch-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/astrofetch.exe" "dist/$package/astrofetch.exe"
          Compress-Archive -Path "dist/$package/astrofetch.exe" -DestinationPath "dist/$package.zip" -Force

      - name: Upload packaged asset
        uses: actions/upload-artifact@v7
        with:
          name: astrofetch-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/astrofetch-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Show release assets
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print | sort

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%P\n' | sort | xargs -r sha256sum > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
